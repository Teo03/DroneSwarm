# PPO configuration for DroneSwarm with RGB camera
# Uses CNN feature extractor for image observations

seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
# Hybrid observation: camera (CNN) + state (MLP) like a real drone with IMU
models:
  separate: False
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      # CNN for camera images
      - name: camera_features
        input: permute(STATES["camera"], (0, 3, 1, 2))  # NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      # MLP for state (IMU data)
      - name: state_features
        input: STATES["state"]
        layers: [64, 64]
        activations: elu
      # Combine camera and state features
      - name: combined
        input: concatenate([camera_features, state_features])
        layers: [256]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      # CNN for camera images
      - name: camera_features
        input: permute(STATES["camera"], (0, 3, 1, 2))  # NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      # MLP for state (IMU data)
      - name: state_features
        input: STATES["state"]
        layers: [64, 64]
        activations: elu
      # Combine camera and state features
      - name: combined
        input: concatenate([camera_features, state_features])
        layers: [256]
        activations: elu
    output: ONE


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 64  # steps per environment before update (from Isaac Lab camera example)
  learning_epochs: 4
  mini_batches: 32  # larger batches for GPU efficiency (from Isaac Lab camera example)
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0  # no entropy bonus (from Isaac Lab camera example)
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # logging and checkpoint
  # To set run name: agent.experiment.experiment_name=my_run
  experiment:
    directory: "droneswarm_direct"
    experiment_name: ""  # Set via CLI: agent.experiment.experiment_name=my_run
    write_interval: 100  # Log every 100 timesteps
    checkpoint_interval: 5000  # Save model every 5000 timesteps
    wandb: True  # Enable Weights & Biases logging
    wandb_kwargs:
      project: "DroneSwarm"
      tags: ["drone", "vision", "ppo", "isaaclab"]


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 25000  # Training timesteps
  environment_info: log
